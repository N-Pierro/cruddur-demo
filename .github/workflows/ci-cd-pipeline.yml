name: cruddur CI/CD Pipeline

on:
  push:
    branches: [main, week-1, feature/*]
  pull_request:
    branches: [main, develop]

  workflow_dispatch:
  

env:
  AWS_REGION: us-east-1 
  ECR_REPOSITORY_BACKEND: cruddur-backend
  ECR_REPOSITORY_FRONTEND: cruddur-frontend
  EKS_CLUSTER_NAME: cruddur-cluster



jobs:
  # ===================== Detech Changes ===================================
  
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      infrastructure-changed: ${{ steps.changes.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/path-filter
        id: changes
        with: 
          filters: |
            backend:
              - 'backend-flask/**'
            frontend:
              - 'frontend-react-js/**'
            infrastructure:
              - 'infrastructure/**'
              - '.github/workflows/**'

# ====================== Backend Testing ==================================

  test-backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true'
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cruddur_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend-flask/requirements.txt') }}
      - name: Install dependencies
        run: |
          cd backend-flask
          pip install -r requirements.txt
          pip install pytest coverage pytest-cov flake8 black

      - name: Code formatting check
        run: | 
          cd backend-flask
          black --check .
          flake8 . --count --max-complexity=10 --max-line-length=88 --statistics
      - name: Set up test database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/cruddur_test
        run: |
          cd backend-flask
          python -c "
          import psycopg2
          from db.schema_load import load_schema
          load_schema()
          "

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/cruddur_test
          FLASK_ENV: testing
        run: |
          cd backend-flask
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=html
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: backend-flask/coverage.xml
          flags: backend

      - name: Upload test artifacts 
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: backend-test-results
          path: | 
            backend-flask/coverage.xml
            backend-flask/htmlcov/

#======================= Frontend Testing =================================

  test-frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend.changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with: 
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend-react-js/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend-react-js
          npm ci

      - name: Lint code
        run: |
          cd frontend-react-js
          npm run lint

      - name: Run unit test
        run: |
          cd frontend-react-js
          npm run test -- --coverage --watchALL=false --testResultsProcessor=jest-sonar-reporter

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: frontend-react-js/coverage/lcov.info
          flags: frontend

# ====================== Security Scanning =================================

  security-scan:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history for better analysis

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'  
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Run Trivy vulnerability scanner (config)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'

      - name: Upload Trivy scan results to GITHUB Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with: 
          sarif_file: 'trivy-fs-results.sarif'

      - name: Run Semgrep security scan
        uses: returntocorp/semgrep-action@v1
        with:
          generateSarif: "1"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMEGREP_APP_TOKEN }}

